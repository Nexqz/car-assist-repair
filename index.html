<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Assist Repair</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="logo">C A R</div>
      <button class="theme-btn">light/dark</button>
    </header>
    <main>
      <section class="vin-search">
        <h1>Lookup a Vehicle</h1>
        <div class="search-bar">
          <input type="text" id="vin-search" placeholder="Enter VIN number" />
          <button id="search-btn" class="search-btn">Search</button>
        </div>
      </section>
      <p class="vehicle-message">No vehicle selected</p>
      <section class="vehicle-content"></section>
    </main>

    <footer></footer>
  </body>
</html>
